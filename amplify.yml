version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Vite 8 requires Node ^20.19 || >=22.12. Amplify's build image does not
        # always ship one of those by default, so the version is pinned via nvm.
        - nvm install 22
        - nvm use 22
        - node -v
        # --include=dev is explicit on purpose: vite, tsc and tailwind are
        # devDependencies, and the build breaks if the environment sets NODE_ENV=production.
        - npm ci --include=dev
    build:
      commands:
        - npm run build
  artifacts:
    # Vite builds the site into dist/. The contents of public/ (robots.txt, sitemap.xml
    # and the Google verification file) are copied there unchanged.
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
