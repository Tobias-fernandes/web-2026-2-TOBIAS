# HTTP headers applied by Amplify Hosting.
#
# Files with a hash in their name (dist/assets/*) can be cached forever;
# index.html must always be revalidated so a new deploy reaches the user on
# their first visit.
customHeaders:
  - pattern: "/assets/*"
    headers:
      - key: Cache-Control
        value: "public, max-age=31536000, immutable"

  - pattern: "/index.html"
    headers:
      - key: Cache-Control
        value: "public, max-age=0, must-revalidate"

  # The Cognito tokens live in sessionStorage, readable by any script on the
  # page — so what keeps them safe is keeping foreign scripts off the page.
  # No inline script is allowed (the theme bootstrap lives in
  # public/theme-init.js for that reason; the JSON-LD blocks in index.html are
  # data, not scripts, and CSP does not apply to them).
  # connect-src covers Cognito (cognito-idp.<region>.amazonaws.com, plus the
  # hosted domain *.amazoncognito.com the Google sign-in trades its code at) and an API
  # on API Gateway or App Runner. An API on a custom domain must be added here.
  - pattern: "/**/*"
    headers:
      - key: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.amazonaws.com https://*.amazoncognito.com https://*.awsapprunner.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
      - key: Strict-Transport-Security
        value: "max-age=31536000; includeSubDomains"
      - key: X-Frame-Options
        value: "DENY"
      - key: X-Content-Type-Options
        value: "nosniff"
      - key: Referrer-Policy
        value: "strict-origin-when-cross-origin"
      - key: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=()"
