<!-- ================ MARKUP REQUIRED BY THE ASSIGNMENT: FAQPage ================
     Kept static in the HTML (rather than injected by JavaScript) so Google reads the
     rich result without depending on the React bundle rendering. The same questions are
     rendered on the landing page by src/pages/landing/constants.ts — keep both in sync.
================================================================================== -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "O que é o AltoTech Manager?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "É um sistema web de gestão para empresas juniores. Ele reúne em um só lugar o funil comercial, os projetos, as horas dos membros, o financeiro e os indicadores que a EJ precisa para prestar contas no fim da gestão."
      }
    },
    {
      "@type": "Question",
      "name": "Quem pode usar o sistema?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Qualquer empresa júnior, federada ou em processo de federação, e também núcleos de extensão e ligas acadêmicas que trabalham por projetos com equipes que mudam todo ano."
      }
    },
    {
      "@type": "Question",
      "name": "O AltoTech Manager é gratuito?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Sim. O sistema é gratuito para empresas juniores: não há mensalidade, cobrança por membro nem limite de projetos, de clientes ou de horas lançadas."
      }
    },
    {
      "@type": "Question",
      "name": "Precisa instalar alguma coisa?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Não. É um sistema web: abre no navegador, no computador ou no celular, sem instalação, sem servidor próprio e sem planilha para manter em paralelo."
      }
    },
    {
      "@type": "Question",
      "name": "O que acontece na troca de diretoria?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Nada se perde. Cada ano é uma gestão, com diretoria e metas próprias, e o cargo de cada pessoa é registrado dentro dela. A diretoria que entra encontra o histórico completo de projetos, horas, clientes e contas — e consegue comparar o próprio ano com o da gestão anterior."
      }
    },
    {
      "@type": "Question",
      "name": "Como o sistema controla as horas dos membros?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "O membro preenche a semana em uma grade, marcando se a hora foi de projeto, de gestão interna, de capacitação ou de prospecção. Não há fila de aprovação: a folha é um guia para a EJ se enxergar, não um ponto a ser fiscalizado — e toda hora lançada já entra no relatório, o que mantém a diretoria enxergando sobrecarga e ociosidade antes que virem problema."
      }
    },
    {
      "@type": "Question",
      "name": "Como acompanho o andamento dos projetos?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Pelo quadro de projetos, que mostra escopo, gerente, prazo e orçamento de horas de cada contrato, com o consumo em tempo real e o histórico do que já foi entregue."
      }
    }
  ]
}
</script>
