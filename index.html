<!-- ====================== MARKUP EXIGIDO NA ATIVIDADE: FAQPage ======================
     Mantido estático no HTML (e não injetado por JavaScript) para que o Google leia o
     rich result sem depender da renderização do bundle React. As mesmas perguntas são
     renderizadas na landing por src/pages/landing/constants.ts — manter os dois em sincronia.
================================================================================== -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "O que é o AltoTech Manager?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "É um sistema web de gestão para empresas juniores. Ele reúne em um só lugar o acompanhamento de projetos, o registro de horas dos membros, o cadastro de clientes e os números que a EJ precisa prestar de contas no fim da gestão."
      }
    },
    {
      "@type": "Question",
      "name": "Quem pode usar o sistema?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Qualquer empresa júnior, federada ou em processo de federação, e também núcleos de extensão e ligas acadêmicas que trabalham por projetos com equipes rotativas."
      }
    },
    {
      "@type": "Question",
      "name": "O AltoTech Manager é gratuito?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Sim. É um projeto acadêmico de código aberto, desenvolvido na disciplina de Desenvolvimento Web do Bacharelado em Tecnologia da Informação da UFERSA. O código está publicado no GitHub e pode ser usado e adaptado livremente."
      }
    },
    {
      "@type": "Question",
      "name": "Quais tecnologias são usadas no projeto?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "A interface é uma aplicação React com Vite, TypeScript e Tailwind CSS, publicada como site estático no AWS Amplify. A camada de dados é isolada em serviços, preparada para consumir uma API na AWS. O repositório traz as instruções de instalação e a estrutura de pastas do sistema."
      }
    },
    {
      "@type": "Question",
      "name": "Como o sistema controla as horas dos membros?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Cada membro lança as horas dedicadas em um projeto e o total aparece consolidado por pessoa, por projeto e por período, o que ajuda a diretoria a enxergar sobrecarga e ociosidade antes que virem problema."
      }
    },
    {
      "@type": "Question",
      "name": "Como acompanho o andamento dos projetos?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Pelo painel de projetos, que mostra escopo, responsável, prazo e situação atual de cada contrato em execução, com o histórico do que já foi entregue."
      }
    }
  ]
}
</script>
